# Tuner. The canvas (vst/canvas.png, tools/make_canvas.py 960 440) is left blank by the skin: src/screendraw.c finds its
# marker edges on screen and draws the tuner into it. Keep it left of x ~1025, where MPC's Q-Link panel slides in.
theme_bg=0d0221
theme_box=1a0533
theme_ink=f5e6ff
theme_ink_dim=9d7bd8
theme_ink_faint=3a0c5c
theme_accent=ff2a6d
theme_accent_hi=05d9e8
theme_seg_active=ff2a6d
theme_seg_inactive=24083f
theme_seg_active_tx=0d0221
theme_lcd=0b0420
theme_line=3a0c5c
theme_panel=1a0533
theme_knob_face=24083f
theme_knob_ring=3a0c5c
theme_knob_dot=05d9e8
theme_tab_on=ff2a6d
theme_tab_on_tx=0d0221

[tab TUNER]
art file=canvas.png x=40 y=100 w=960 h=440
text cx=1140 cy=118 label="TUNER" size=2.2 color=ff2a6d
text cx=1140 cy=150 label="chromatic tuner" size=1.1 color=05d9e8
enum_v cx=1140 cy=330 w=200 h=120 label="TARGET" key=target
knob cx=1080 cy=540 r=40 label="REF" key=ref
toggle cx=1200 cy=530 label="MUTE" key=mute bw=100
readout cx=520 cy=600 w=600 h=30 label="" key=status talign=center
qlinks "TUNER" = ref,mute
