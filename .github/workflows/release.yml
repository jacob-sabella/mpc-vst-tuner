# Build Tuner for MPC OS Gen1 (armv7) and Gen2 (aarch64) and attach both zips to a DRAFT release, with
# mpc-vst-plugins' reusable workflow (its docs/RELEASING.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE
# commit in both places below (and in test.yml): move them together.
# Run it from the Actions tab or `gh workflow run release.yml -f version=<x.y.z>`, then publish the draft
# (as a prerelease while the version is 0.x) once it has been tested on a device.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zips and INSTALL.md, e.g. 0.1.0
        required: true
        type: string
      dry_run:
        description: Build and package only (the zips as run artifacts, no draft release)
        type: boolean
        default: false

jobs:
  vst:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@37beeea8b94e42d3eac1022e0476ac66bc8c385c
    permissions: { contents: write }
    with:
      tag: tuner-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 37beeea8b94e42d3eac1022e0476ac66bc8c385c
      vst_dir: vst
      build: vst/build.sh
      host_test: tests/run.sh
      about: "A chromatic tuner insert that draws its needle or strobe straight onto the MPC's screen."
      license: MIT
      dry_run: ${{ inputs.dry_run }}
